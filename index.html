<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a07">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CEI">
<style>html{color-scheme:dark;background:#0c0a07}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CEI Inmobiliaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap">
<style>
:root{
  /* Concepto: app móvil de negro cálido y oro de la marca; navegación inferior distinta para cada rol */
  --bg:#0c0a07;--surface:#15120d;--raise:#1e1a11;--line:#2d2717;
  --fg:#f3eddf;--muted:#a89f89;
  --gold:#c9a24b;--gold-hi:#ecd28f;--gold-ink:#1b1405;
  --ok:#7cc59a;--warn:#e3b24f;--bad:#e5806f;
  --display:'Syne','Trebuchet MS',sans-serif;--body:'Figtree',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 104px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,8vw,40px);line-height:1.08;font-weight:800}
h2{font-size:22px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ic{flex:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font:800 20px var(--display);letter-spacing:.14em;display:block;line-height:1}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;white-space:nowrap}
.logo-full{display:block;height:min(190px,26vh);width:auto;max-width:100%;margin:0 auto}
.mark{display:block;flex:none}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--gold-hi);white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none}
main{display:flex;flex-direction:column;gap:18px;padding-top:20px}
.banner{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.hero{background:linear-gradient(160deg,#241d0e,#15120d 60%);border:1px solid #4a3c1c;border-radius:20px;padding:22px}
.amount{font:800 clamp(34px,10vw,48px)/1 var(--display);color:var(--gold-hi);font-variant-numeric:tabular-nums;margin:6px 0 16px;overflow-wrap:anywhere}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));border-radius:99px}
.split{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.split div{min-width:0}.split b{display:block;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.stat b{display:block;font:800 28px/1.1 var(--display);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat.hot b{color:var(--gold-hi)}
.section{display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.action{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;color:var(--fg);cursor:pointer;font-size:14px;font-weight:600;min-width:0}
.action .ic{color:var(--gold)}

/* rows */
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line);cursor:pointer;text-align:left}
.list .row:first-child{border-top:0}
.row .main{min-width:0;flex:1}
.row .main b{overflow-wrap:anywhere}
.row .amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums}
.static{cursor:default}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.gold{color:var(--gold-hi)}

/* buttons / forms */
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--raise);color:var(--fg);font:600 15px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--gold-ink);border-color:transparent}
.btn.bad{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.block{width:100%}.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;min-height:46px;background:var(--raise);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:400 16px var(--body)}
textarea{min-height:96px;resize:vertical}
input[type=file]{padding:9px 12px}
.form{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:600 14px var(--body);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--raise);color:var(--gold-hi)}

/* media */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;text-align:left;color:var(--fg);cursor:pointer;min-width:0}
.tile img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--raise)}
.tile div{padding:10px 12px}
.tile b{display:block;font-size:14px;overflow-wrap:anywhere}
.cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;display:block;background:var(--raise)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.nav div{max-width:760px;margin:0 auto;display:flex;gap:2px}
.nav button{flex:1;min-width:0;min-height:52px;background:transparent;border:0;border-radius:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;cursor:pointer;position:relative}
.nav button[aria-current=page]{color:var(--gold-hi)}
.nav button[aria-current=page]::after{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--gold-ink);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.receipt{border:1px solid #4a3c1c;border-radius:14px;padding:18px;background:linear-gradient(160deg,#211a0c,#15120d);display:flex;flex-direction:column;gap:12px}
.receipt dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.receipt dt{color:var(--muted)}.receipt dd{margin:0;text-align:right;overflow-wrap:anywhere}
.receipt .total{font:800 30px var(--display);color:var(--gold-hi);font-variant-numeric:tabular-nums}
.boleta{border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
.boleta img{max-width:100%;max-height:320px;border-radius:8px}

/* auth */
.auth{display:flex;flex-direction:column;gap:20px;padding-top:max(36px,8vh)}
.demo{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:18px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--gold-hi);color:var(--gold-ink);font-weight:600;padding:10px 16px;border-radius:12px;max-width:min(92vw,420px);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head>

function art(kind,s=0){
  const W=640,H=400,g='#c9a24b';
  let o=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16120b"/><stop offset="1" stop-color="#5d4720"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#a)"/>`;
  if(kind==='render'){
    o+=`<circle cx="${500-s*70}" cy="105" r="34" fill="#ecd28f" opacity=".85"/><rect y="310" width="${W}" height="90" fill="#0d0b07"/>`;
    const x=70+s*45;
    o+=`<rect x="${x}" y="195" width="300" height="115" fill="#201a0f" stroke="${g}" stroke-width="2"/><rect x="${x+24}" y="140" width="160" height="55" fill="#2b2315" stroke="${g}" stroke-width="2"/>`;
    for(let i=0;i<4;i++)o+=`<rect x="${x+22+i*68}" y="222" width="44" height="64" fill="#ecd28f" opacity="${.3+((i+s)%3)*.22}"/>`;
  }else if(kind==='proyecto'){
    o+=`<polygon points="40,330 600,330 560,70 80,70" fill="#1a150c" stroke="${g}" stroke-opacity=".5"/>`;
    for(let r=0;r<4;r++)for(let c=0;c<10;c++)o+=`<rect x="${96+c*46+r*(-3)}" y="${92+r*56}" width="38" height="44" fill="${(c+r+s)%7===0?'#ecd28f':'#2c2414'}" opacity="${(c+r+s)%7===0?.8:1}" stroke="${g}" stroke-opacity=".4"/>`;
  }else if(kind==='lote'){
    o+=`<polygon points="0,250 130,130 200,190 330,90 470,210 560,150 640,230 640,250" fill="#0f0c07"/><rect y="250" width="${W}" height="150" fill="#22190c"/>`;
    o+=`<polygon points="150,400 230,285 470,285 560,400" fill="#2d2312" stroke="${g}" stroke-width="2" stroke-dasharray="8 6"/>`;
    [[230,285],[470,285],[150,400],[560,400]].forEach(p=>o+=`<rect x="${p[0]-4}" y="${p[1]-26}" width="8" height="26" fill="#ecd28f"/>`);
  }else{
    o+=`<rect y="300" width="${W}" height="100" fill="#0d0b07"/>`;
    for(let i=0;i<5;i++)o+=`<rect x="${90+i*100}" y="${210-((i+s)%3)*30}" width="14" height="${90+((i+s)%3)*30}" fill="#3a2e17" stroke="${g}"/>`;
    o+=`<rect x="80" y="${190-s*10}" width="440" height="12" fill="#3a2e17" stroke="${g}"/>`;
  }
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(o+'</svg>');
}

const cuotaMonto=p=>(p.price-p.enganche)/p.cuotas;
function acct(u){
  const mine=S.pays.filter(p=>p.uid===u.id);
  const ap=mine.filter(p=>p.status==='aprobado');
  const paid=ap.reduce((a,p)=>a+p.amount,0);
  const rev=mine.filter(p=>p.status==='revision').reduce((a,p)=>a+p.amount,0);
  const cuotas=ap.filter(p=>p.concept.startsWith('Cuota')).length;
  const monto=cuotaMonto(u.plan);
  return {paid,rev,saldo:u.plan.price-paid,cuotas,pct:Math.round(paid/u.plan.price*100),next:cuotas+1,monto,
    due:new Date(2026,cuotas+1,5).toLocaleDateString('es-GT',{day:'numeric',month:'long',year:'numeric'})};
}
let tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600);}
function readFile(f){return new Promise(r=>{
  if(!f||!f.size)return r(null);
  if(!f.type.startsWith('image/')||f.size>3e6)return r({name:f.name,url:null});
  const fr=new FileReader();fr.onload=()=>r({name:f.name,url:fr.result});fr.onerror=()=>r({name:f.name,url:null});fr.readAsDataURL(f);
});}

    <button class="btn gold block" type="submit">${ic('upload')} Enviar para revisión</button></form>`;}
  if(m.t==='pay'){const p=S.pays.find(x=>x.id===m.id);t=p.concept;
    if(p.status==='aprobado'&&p.receipt){const pr=proj(u.projectId);
      b=`<div class="receipt"><div class="brand">${mark(34)}<div><b style="font-size:16px">CEI</b><span>${p.receipt.type==='Factura'?'Factura':'Recibo de pago'}</span></div></div>
      <div class="total">${fmtQ(p.amount)}</div>
      <dl><dt>N.º</dt><dd>${esc(p.receipt.no)}</dd><dt>Fecha</dt><dd>${fmtD(p.date)}</dd><dt>Cliente</dt><dd>${esc(u.name)}</dd><dt>Propiedad</dt><dd>${esc(pr.name)} · ${esc(u.lot)}</dd><dt>Concepto</dt><dd>${esc(p.concept)}</dd><dt>Pago</dt><dd>${esc(p.bank)} · Boleta ${esc(p.ref)}</dd></dl></div>
      <p class="muted small">Vista de ejemplo. En la versión real, aquí se muestra el PDF emitido${p.receipt.type==='Factura'?' y certificado por SAT (FEL)':''}.</p>`;}
    else if(p.status==='rechazado')b=`<div class="card"><p>${pill('rechazado')}</p><p style="margin-top:10px"><b>Motivo:</b> ${esc(p.note||'Sin detalle')}</p></div><button class="btn gold block" data-a="openUpload">${ic('upload')} Subir una boleta nueva</button>`;
    else b=`<div class="card"><p>${pill('revision')}</p><p class="muted" style="margin-top:10px">Recibimos tu boleta de ${fmtQ(p.amount)}. El administrador la revisa y te generamos tu recibo o factura al aprobarla.</p></div>`;}
  if(m.t==='review'){const p=S.pays.find(x=>x.id===m.id),c=user(p.uid);t='Revisar boleta';
    b=`<div class="card"><b>${esc(c.name)}</b><p class="muted small">${esc(p.concept)} · ${fmtQ(p.amount)} · ${fmtD(p.date)} · ${esc(p.bank)} · Boleta ${esc(p.ref)}</p><p style="margin-top:8px">${pill(p.status)}</p></div>
    <div class="boleta">${p.fileUrl?`<img src="${p.fileUrl}" alt="Boleta enviada">`:p.fileName?esc('Archivo: '+p.fileName):'Boleta de ejemplo (sin imagen)'}</div>
    ${p.status==='revision'?`<div class="form">${field('f-reason','Motivo si la rechazas',`<select id="f-reason"><option>Boleta ilegible</option><option>El monto no coincide</option><option>Boleta duplicada</option><option>Otro motivo</option></select>`)}
    <div class="btns"><button class="btn gold" data-a="decide" data-id="${p.id}" data-d="Recibo">${ic('check',18)} Aprobar y emitir recibo</button><button class="btn" data-a="decide" data-id="${p.id}" data-d="Factura">Aprobar con factura</button><button class="btn bad" data-a="decide" data-id="${p.id}" data-d="no">Rechazar</button></div></div>`:''}`;}
  if(m.t==='req'){t='Nueva solicitud';
    b=`<form class="form" data-form="req">${field('f-kind','¿Qué necesitas?',`<select id="f-kind" name="kind">${['Video del avance','Información','Fotos de mi lote','Renders del proyecto','Estado de cuenta','Otro'].map(x=>`<option${x===m.kind?' selected':''}>${x}</option>`).join('')}</select>`)}${field('f-msg','Mensaje',`<textarea id="f-msg" name="msg" required></textarea>`)}<button class="btn gold block" type="submit">Enviar solicitud</button></form>`;}
  if(m.t==='reqview'){const r=S.reqs.find(x=>x.id===m.id);t=r.kind;
    b=`<div class="card"><p>${pill(r.status)}</p><p style="margin-top:10px">${esc(r.msg)}</p><p class="muted small" style="margin-top:6px">${fmtD(r.date)}</p></div>${r.reply?`<div class="card"><b>Respuesta de CEI</b><p style="margin-top:6px">${esc(r.reply)}</p></div>`:'<p class="muted">Aún no hay respuesta. Te avisamos cuando la tengamos.</p>'}`;}
  if(m.t==='respond'){const r=S.reqs.find(x=>x.id===m.id);t='Responder solicitud';
    b=`<div class="card"><b>${esc(user(r.uid).name)} · ${esc(r.kind)}</b><p style="margin-top:6px">${esc(r.msg)}</p></div>
    <form class="form" data-form="respond" data-id="${r.id}">${field('f-reply','Respuesta',`<textarea id="f-reply" name="reply" required>${esc(r.reply)}</textarea>`)}${field('f-status','Estado',`<select id="f-status" name="status"><option value="proceso"${r.status==='proceso'?' selected':''}>En proceso</option><option value="atendida"${r.status==='atendida'?' selected':''}>Atendida</option></select>`)}<button class="btn gold block" type="submit">Guardar respuesta</button></form>`;}
  if(m.t==='assign'){const x=user(m.id);t='Asignar '+x.name;const pl=x.plan||{price:'',enganche:'',cuotas:36};
    b=`<form class="form" data-form="assign" data-id="${x.id}">
    ${field('f-role','Rol',`<select id="f-role" name="role">${Object.keys(ROLE).map(k=>`<option value="${k}"${x.role===k?' selected':''}>${ROLE[k]}</option>`).join('')}</select>`)}
    ${field('f-proj','Proyecto',`<select id="f-proj" name="proj"><option value="">Sin proyecto</option>${S.projects.map(p=>`<option value="${p.id}"${x.projectId===p.id?' selected':''}>${esc(p.name)}</option>`).join('')}</select>`)}
    ${input('f-lot','Lote',`value="${esc(x.lot)}" placeholder="Ej. L-23"`)}
    <div class="two">${input('f-price','Precio del lote (Q)',`type="number" min="0" value="${pl.price}" inputmode="decimal"`)}${input('f-eng','Enganche (Q)',`type="number" min="0" value="${pl.enganche}" inputmode="decimal"`)}</div>
    ${input('f-cuotas','Número de cuotas',`type="number" min="1" value="${pl.cuotas}" inputmode="numeric"`)}
    <button class="btn gold block" type="submit">Guardar</button></form>`;}
  if(m.t==='newproj'){t='Nuevo proyecto';
    b=`<form class="form" data-form="newproj">${input('f-name','Nombre','required')}${input('f-place','Ubicación','required')}${input('f-lots','Número de lotes','type="number" min="1" required inputmode="numeric"')}${field('f-desc','Descripción',`<textarea id="f-desc" name="desc"></textarea>`)}<button class="btn gold block" type="submit">Crear proyecto</button></form>`;}
  if(m.t==='upimg'){t='Subir imagen';
    b=`<form class="form" data-form="upimg" data-id="${m.id}">${field('f-kind','Tipo',`<select id="f-kind" name="kind"><option value="render">Render</option><option value="proyecto">Foto del proyecto</option></select>`)}${input('f-title','Título','required')}${input('f-file','Imagen','type="file" accept="image/*" required')}<button class="btn gold block" type="submit">Publicar</button></form>`;}
  if(m.t==='light'){const x=S.media.find(y=>y.id===m.id);t=x.title;
    b=`<img class="cover" src="${src(x)}" alt="${esc(x.title)}">${x.text?`<p>${esc(x.text)}</p>`:''}<p class="muted small">${x.demo?'Imagen de ejemplo':fmtD(x.date)}</p>`;}
  return `<div class="scrim" data-a="closeModal" data-scrim="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(t)}"><div class="sheet-head"><h2>${esc(t)}</h2><button class="iconbtn" data-a="closeModal" aria-label="Cerrar">${ic('x')}</button></div>${b}</div></div>`;
}

/* ---------- marco de la app ---------- */
function render(){
  const app=document.getElementById('app');
  if(!S.me){app.innerHTML=authHTML();return;}
  const u=me(),pend=u.role==='cliente'&&u.status==='pendiente',tabs=TABS[u.role];
  const body=pend?`<div class="card section" style="text-align:center;align-items:center;padding:32px 20px"><span style="color:var(--gold)">${ic('users',36)}</span><h2>Tu cuenta está en revisión</h2><p class="muted">El administrador de CEI te asignará tu proyecto y tu lote. Cuando lo haga, verás aquí tu saldo, tus pagos y tu proyecto.</p><a class="btn gold" href="https://wa.me/${WA}" target="_blank" rel="noopener">Escribir a CEI por WhatsApp</a></div>`:(V[u.role][S.view]||(()=>''))(u);
  const badge=k=>u.role==='admin'&&k==='pagos'?S.pays.filter(p=>p.status==='revision').length:0;
  app.innerHTML=`<div class="wrap"><header class="top"><div class="brand">${mark(38)}<div><b>CEI</b><span>${ROLE[u.role]}</span></div></div><div class="who"><span class="chip">${esc(u.name.split(' ')[0])}</span><button class="iconbtn" data-a="logout" aria-label="Salir">${ic('logout')}</button></div></header><main><p class="banner">Versión de demostración con datos de ejemplo. Lo que subas aquí no se guarda al cerrar la página.</p>${body}</main></div>
  ${pend?'':`<nav class="nav" aria-label="Principal"><div>${tabs.map(([k,l,i])=>`<button data-a="go" data-v="${k}" ${S.view===k?'aria-current="page"':''}>${ic(i,22)}${l}${badge(k)?`<span class="badge">${badge(k)}</span>`:''}</button>`).join('')}</div></nav>`}
  ${modalHTML()}`;
}

/* ---------- acciones ---------- */
const A={
  auth:d=>{S.auth=d.m;render();},
  demo:d=>signIn(d.id),
  logout:()=>{S.me=null;S.modal=null;render();window.scrollTo(0,0);},
  go:d=>{S.view=d.v;S.modal=null;render();window.scrollTo(0,0);},
  goSub:d=>{S.sub=d.sub;S.view='proyecto';render();window.scrollTo(0,0);},
  setSub:d=>{S.sub=d.sub;render();},
  setPF:d=>{S.pfilter=d.f;render();},
  closeModal:()=>{S.modal=null;render();},
  openUpload:()=>{S.modal={t:'upload'};render();},
  openPay:d=>{S.modal={t:'pay',id:d.id};render();},
  openReview:d=>{S.modal={t:'review',id:d.id};render();},
  openReq:d=>{const r=S.reqs.find(x=>x.id===d.id);S.modal=r?{t:'reqview',id:r.id}:{t:'req',kind:d.kind||''};render();},
  openRespond:d=>{S.modal={t:'respond',id:d.id};render();},
  openAssign:d=>{S.modal={t:'assign',id:d.id};render();},
  openNewProj:()=>{S.modal={t:'newproj'};render();},
  openUpImg:d=>{S.modal={t:'upimg',id:d.id};render();},
  openLight:d=>{S.modal={t:'light',id:d.id};render();},
  copy:d=>{const f=()=>toast('Número copiado');(navigator.clipboard?navigator.clipboard.writeText(d.t):Promise.reject()).then(f,()=>toast('Selecciona el número para copiarlo'));},
  decide:d=>{
    const p=S.pays.find(x=>x.id===d.id);
    if(d.d==='no'){p.status='rechazado';p.note=document.getElementById('f-reason').value;toast('Boleta rechazada');}
    else{p.status='aprobado';p.receipt={no:d.d==='Factura'?'FEL-'+nextRec().slice(4):nextRec(),type:d.d};toast(d.d+' emitido');}
    S.modal=null;render();
  }
};
const F={
  login(f,v){const x=S.users.find(u=>u.email===v('email').toLowerCase());if(!x)return toast('No encontramos esa cuenta. Crea una o usa un acceso de demostración.');signIn(x.id);},
  register(f,v){
    if(S.users.some(u=>u.email===v('email').toLowerCase()))return toast('Ese correo ya tiene una cuenta.');
    const x={id:'u'+Date.now(),name:v('name'),email:v('email').toLowerCase(),phone:v('phone'),role:'cliente',projectId:null,lot:'',status:'pendiente'};
    S.users.push(x);signIn(x.id);
  },
  async upload(f,v){
    const file=await readFile(f.elements.file.files[0]);
    S.pays.push({id:'p'+Date.now(),uid:S.me,concept:v('concept'),amount:+v('amount'),date:v('date'),bank:v('bank'),ref:v('ref'),status:'revision',receipt:null,fileName:file&&file.name,fileUrl:file&&file.url});
    S.modal=null;render();toast('Boleta enviada. La revisamos pronto.');
  },
  req(f,v){const u=me();S.reqs.push({id:'r'+Date.now(),uid:u.id,pid:u.projectId,kind:v('kind'),msg:v('msg'),status:'abierta',date:TODAY,reply:''});S.modal=null;S.view='solicitudes';render();toast('Solicitud enviada');},
  visit(f,v){const u=me();S.reqs.push({id:'r'+Date.now(),uid:u.id,pid:u.projectId,kind:'Visita al terreno',msg:`${fmtD(v('date'))}, ${v('time')}. ${v('note')}`.trim(),status:'abierta',date:TODAY,reply:''});f.reset();toast('Solicitud de visita enviada');},
  respond(f,v){const r=S.reqs.find(x=>x.id===f.dataset.id);r.reply=v('reply');r.status=v('status');S.modal=null;render();toast('Respuesta guardada');},
  assign(f,v){
    const x=user(f.dataset.id);
    if(v('role')==='cliente'&&v('proj')&&!x.plan&&!(+v('price')>0))return toast('Indica el precio del lote para crear el plan de pagos.');
    x.role=v('role');x.projectId=v('proj')||null;x.lot=v('lot');
    if(x.role==='cliente'){x.status=x.projectId?'activo':'pendiente';if(+v('price')>0)x.plan={price:+v('price'),enganche:+v('eng')||0,cuotas:+v('cuotas')||1};}
    else x.status='activo';
    S.modal=null;render();toast('Cambios guardados');
  },
  newproj(f,v){S.projects.push({id:'p'+Date.now(),name:v('name'),place:v('place'),lots:+v('lots'),desc:v('desc'),pct:0,etapa:'Por iniciar',map:''});S.modal=null;render();toast('Proyecto creado');},
  async upimg(f,v){const file=await readFile(f.elements.file.files[0]);S.media.push({id:'m'+Date.now(),pid:f.dataset.id,kind:v('kind'),title:v('title'),seed:0,date:TODAY,url:file&&file.url});S.modal=null;render();toast('Imagen publicada');},
  async avance(f,v){
    const file=await readFile(f.elements.file.files[0]),u=me(),p=proj(u.projectId);
    p.pct=Math.max(0,Math.min(100,+v('pct')));p.etapa=v('etapa');
    S.media.push({id:'m'+Date.now(),pid:p.id,kind:'avance',title:v('title'),etapa:v('etapa'),pct:p.pct,seed:1,date:TODAY,text:v('text'),url:file&&file.url});
    render();toast('Avance publicado. Los clientes ya lo ven.');
  }
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  if(t.dataset.scrim&&e.target!==t)return;
  const fn=A[t.dataset.a];if(fn)fn(t.dataset);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.modal){A.closeModal();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-a]')){e.preventDefault();e.target.click();}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  const v=n=>(f.elements[n]?f.elements[n].value:'').trim();
  F[f.dataset.form](f,v);
});
render();
</script>
</body>
</html>
